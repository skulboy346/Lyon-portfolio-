<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYON | Exec Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- CROPPER.JS LIBRARIES -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
  :root { --bg: #050810; --surface: rgba(255, 255, 255, 0.04); --surface-hover: rgba(255, 255, 255, 0.08); --cyan: #00f0ff; --orange: #ff4f00; --text: #f8fafc; --muted: #94a3b8; --border: rgba(255, 255, 255, 0.1); --danger: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); background-image: radial-gradient(circle at 0% 0%, rgba(0, 240, 255, 0.1) 0%, transparent 40%); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  h1, h2, h3 { font-family: 'Poppins', sans-serif; color: #fff; margin-bottom: 1rem; }
  
  /* LOGIN SCREEN */
  #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); padding: 3rem; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 100%; max-width: 400px; }
  
  /* FORM ELEMENTS */
  input, textarea, select { width: 100%; padding: 14px; margin: 8px 0 16px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: #fff; border-radius: 10px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--cyan); }
  input[type="file"] { padding: 10px; background: rgba(0,240,255,0.05); border: 1px dashed var(--cyan); cursor: pointer; color: var(--cyan); }
  
  button { width: 100%; padding: 14px; background: var(--cyan); color: #000; border: none; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-family: 'Poppins', sans-serif; }
  button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,240,255,0.3); }
  .btn-outline { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
  .btn-outline:hover { background: rgba(0,240,255,0.1); }
  .btn-danger { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); width: auto; padding: 8px 16px; font-size: 0.85rem; }

  /* DASHBOARD LAYOUT */
  #dashboard { display: none; min-height: 100vh; }
  .dash-container { display: flex; max-width: 1400px; margin: 0 auto; padding: 2rem; gap: 2rem; }
  .sidebar { width: 280px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 2rem 1.5rem; height: fit-content; position: sticky; top: 2rem; }
  .sidebar h2 { color: var(--cyan); font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; }
  .tab-btn { background: transparent; color: var(--muted); width: 100%; padding: 12px 15px; text-align: left; border-radius: 10px; border: none; margin-bottom: 5px; font-weight: 500; cursor: pointer; transition: all 0.3s; }
  .tab-btn:hover { background: var(--surface-hover); color: #fff; }
  .tab-btn.active { background: linear-gradient(90deg, rgba(0,240,255,0.1), transparent); color: var(--cyan); border-left: 3px solid var(--cyan); border-radius: 0 10px 10px 0; }
  .main-content { flex-grow: 1; }
  .tab-content { display: none; animation: fadeIn 0.4s ease; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .glass-panel { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
  .data-card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 1.5rem; }
  .data-img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; margin-bottom: 1rem; background: #000; }
  .badge { background: rgba(0,240,255,0.1); color: var(--cyan); padding: 4px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; display: inline-block; margin-bottom: 10px;}

  /* TOAST */
  #toast { position: fixed; bottom: 30px; right: 30px; background: var(--cyan); color: #000; padding: 15px 25px; border-radius: 10px; font-weight: 600; font-family: var(--heading); transform: translateY(100px); opacity: 0; transition: all 0.4s; z-index: 1000; }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* CROPPER MODAL */
  #cropper-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,8,16,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; backdrop-filter: blur(10px); }
  .cropper-box { width: 100%; max-width: 600px; background: var(--surface); padding: 1.5rem; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .cropper-img-container { max-height: 60vh; overflow: hidden; margin-bottom: 1.5rem; border-radius: 10px; background: #000; }
  .cropper-img-container img { display: block; max-width: 100%; }

  @media(max-width: 900px) { .dash-container { flex-direction: column; padding: 1rem; } .sidebar { width: 100%; position: relative; top: 0; display: flex; overflow-x: auto; padding: 1rem; } .sidebar h2 { display: none; } .tab-btn { white-space: nowrap; width: auto; margin-right: 10px; } }
</style>
</head>
<body>

<!-- IMAGE CROPPER MODAL -->
<div id="cropper-modal">
  <div class="cropper-box">
    <h3 style="color:var(--cyan); margin-bottom:15px;"><i class="fas fa-crop-alt"></i> Adjust Image</h3>
    <div class="cropper-img-container"><img id="cropper-image" src="" alt="Crop Area"></div>
    <div style="display: flex; gap: 15px;">
      <button id="crop-btn">Crop & Save Selection</button>
      <button id="cancel-crop-btn" class="btn-outline">Cancel</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast">Notification</div>

<!-- LOGIN VIEW -->
<div id="login-screen">
  <div class="login-card">
    <h2 style="color:var(--cyan);"><i class="fas fa-fingerprint"></i> System Access</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Administrator Email" required>
      <input type="password" id="password" placeholder="Passcode" required>
      <button type="submit">Initialize Session</button>
    </form>
  </div>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashboard">
  <div class="dash-container">
    <div class="sidebar">
      <h2>LYON. CMS</h2>
      <button class="tab-btn active" onclick="switchTab('profile')"><i class="fas fa-user-astronaut"></i> Profile & Hero</button>
      <button class="tab-btn" onclick="switchTab('events')"><i class="fas fa-calendar-alt"></i> Upcoming Events</button>
      <button class="tab-btn" onclick="switchTab('past-events')"><i class="fas fa-history"></i> Past Events</button>
      <button class="tab-btn" onclick="switchTab('content')"><i class="fas fa-layer-group"></i> Manage Portfolio</button>
      <button class="tab-btn" onclick="switchTab('reviews')"><i class="fas fa-star"></i> Reviews & Leads</button>
      <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem;">
        <button id="logout-btn" class="btn-outline"><i class="fas fa-power-off"></i> Terminate Session</button>
      </div>
    </div>

    <div class="main-content">
      
      <!-- 1. PROFILE -->
      <div id="profile" class="tab-content active">
        <div class="glass-panel">
          <h3><i class="fas fa-id-card"></i> Core Identity</h3>
          <form id="profile-form">
            <label style="color:var(--cyan); font-size:0.85rem;"><i class="fas fa-image"></i> Update Profile Picture (1:1 Ratio)</label>
            <input type="file" id="prof-pic" accept="image/*">
            <span id="prof-img-status" style="display:block; color:var(--green); font-size:0.85rem; margin-bottom:10px;"></span>
            <input type="text" id="prof-name" placeholder="AWONIYI SODIQ OPEYEMI">
            <input type="text" id="prof-title" placeholder="Professional Subtitle">
            <textarea id="prof-bio" rows="4" placeholder="Your main introduction..."></textarea>
            <button type="submit" id="prof-btn">Deploy Changes</button>
          </form>
        </div>
      </div>

      <!-- 2. UPCOMING EVENTS -->
      <div id="events" class="tab-content">
        <div class="glass-panel">
          <h3><i class="fas fa-calendar-plus"></i> Schedule New Event</h3>
          <form id="event-form">
            <label style="color:var(--cyan); font-size:0.85rem;"><i class="fas fa-image"></i> Event Flyer (Any Ratio)</label>
            <input type="file" id="ev-flyer" accept="image/*">
            <span id="ev-img-status" style="display:block; color:var(--green); font-size:0.85rem; margin-bottom:10px;"></span>
            <input type="text" id="ev-date" placeholder="Date Label (e.g. NOV 15)" required>
            <input type="text" id="ev-title" placeholder="Event Title" required>
            <input type="text" id="ev-desc" placeholder="Description" required>
            <input type="url" id="ev-link" placeholder="Registration/Action Link (Optional)">
            <button type="submit" id="ev-btn">Publish Event</button>
          </form>
        </div>
        <div id="events-container" class="grid">Loading...</div>
      </div>

      <!-- 3. PAST EVENTS CAROUSEL -->
      <div id="past-events" class="tab-content">
        <div class="glass-panel">
          <h3><i class="fas fa-images"></i> Add to Highlights Carousel</h3>
          <form id="past-event-form">
            <label style="color:var(--cyan); font-size:0.85rem;"><i class="fas fa-image"></i> Cover Image (Required - 16:9 Ratio)</label>
            <input type="file" id="pe-img" accept="image/*" required>
            <span id="pe-img-status" style="display:block; color:var(--green); font-size:0.85rem; margin-bottom:10px;"></span>
            <input type="text" id="pe-title" placeholder="Highlight Title (e.g. NUESA Dean's Cup)" required>
            <textarea id="pe-desc" rows="2" placeholder="Brief achievement description..." required></textarea>
            <button type="submit" id="pe-btn">Add to Carousel</button>
          </form>
        </div>
        <div id="past-events-container" class="grid">Loading...</div>
      </div>

      <!-- PORTFOLIO / CONTENT EDITOR -->
      <div id="content" class="tab-content">
        <div class="glass-panel">
          <h3 id="cont-header"><i class="fas fa-plus-square"></i> Add Portfolio Item</h3>
          <form id="content-form">
            <input type="hidden" id="cont-id">
            <select id="cont-category" required><option value="">Select Category...</option><option value="projects">Digital Infrastructure</option><option value="leadership">Leadership & Operations</option><option value="research">Academic & Data</option></select>
            <input type="text" id="cont-title" placeholder="Item Title" required>
            <input type="text" id="cont-date" placeholder="Date / Subtitle">
            <textarea id="cont-desc" rows="3" placeholder="Description" required></textarea>
            <input type="text" id="cont-icon" placeholder="FontAwesome Class (e.g. fas fa-flag)" required>
            <button type="submit" id="cont-submit-btn">Push to Portfolio</button>
            <button type="button" id="cont-cancel-btn" style="display:none; margin-top:10px;" class="btn-outline">Cancel Edit</button>
          </form>
        </div>
        <div id="content-container" class="grid"></div>
      </div>

      <!-- REVIEWS -->
      <div id="reviews" class="tab-content">
        <div class="glass-panel" style="background:transparent; border:none; padding:0;"><div id="reviews-container" class="grid"></div></div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // 🔴 LIVE FIREBASE CONFIG 🔴
  const firebaseConfig = {
    apiKey: "AIzaSyCYZvEC_V9l4d4bPo6AvUOWiAj8WemcDwQ",
    authDomain: "lyon-portfolio.firebaseapp.com",
    projectId: "lyon-portfolio",
    storageBucket: "lyon-portfolio.firebasestorage.app",
    messagingSenderId: "297623716417",
    appId: "1:297623716417:web:12d8a738aec0174ee07cc0"
  };

  // 🔴 CLOUDINARY SETTINGS 🔴
  const CLOUDINARY_CLOUD_NAME = "dxdxgrvvb";
  const CLOUDINARY_UPLOAD_PRESET = "lyon_portfolio"; 

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let allContentData = {}; // Stores content for editing

  const showToast = (msg, isError = false) => {
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.background = isError ? "var(--danger)" : "var(--cyan)"; t.style.color = isError ? "#fff" : "#000";
    t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
  };

  // --- CROPPER LOGIC ---
  let cropper = null;
  let activeCropTarget = ''; 
  let croppedProfileBlob = null;
  let croppedEventBlob = null;
  let croppedPastEventBlob = null;

  const cropModal = document.getElementById('cropper-modal');
  const cropImage = document.getElementById('cropper-image');

  const openCropper = (file, target, ratio) => {
    activeCropTarget = target;
    const reader = new FileReader();
    reader.onload = (e) => {
      cropImage.src = e.target.result;
      cropModal.style.display = 'flex';
      if(cropper) cropper.destroy();
      cropper = new Cropper(cropImage, { aspectRatio: ratio, viewMode: 2, background: false });
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('prof-pic').addEventListener('change', (e) => { if(e.target.files.length) openCropper(e.target.files[0], 'profile', 1); });
  document.getElementById('ev-flyer').addEventListener('change', (e) => { if(e.target.files.length) openCropper(e.target.files[0], 'event', NaN); });
  document.getElementById('pe-img').addEventListener('change', (e) => { if(e.target.files.length) openCropper(e.target.files[0], 'past_event', 16/9); });

  document.getElementById('crop-btn').addEventListener('click', () => {
    cropper.getCroppedCanvas().toBlob((blob) => {
      if(activeCropTarget === 'profile') { croppedProfileBlob = blob; document.getElementById('prof-img-status').innerText = "✓ Image cropped and ready!"; }
      if(activeCropTarget === 'event') { croppedEventBlob = blob; document.getElementById('ev-img-status').innerText = "✓ Flyer cropped and ready!"; }
      if(activeCropTarget === 'past_event') { croppedPastEventBlob = blob; document.getElementById('pe-img-status').innerText = "✓ Cover cropped and ready!"; }
      cropModal.style.display = 'none';
      showToast("Crop saved!");
    }, 'image/jpeg', 0.8);
  });

  document.getElementById('cancel-crop-btn').addEventListener('click', () => { cropModal.style.display = 'none'; });

  // --- CLOUDINARY UPLOAD ENGINE ---
  const uploadToCloudinary = async (blob) => {
    if (!blob) return null;
    const formData = new FormData();
    formData.append('file', blob);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      return data.secure_url;
    } catch (err) { console.error("Cloudinary Error:", err); throw err; }
  };

  // --- CORE SYSTEM ---
  onAuthStateChanged(auth, (user) => {
    if (user) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; loadAllData(); }
    else { document.getElementById('login-screen').style.display = 'flex'; document.getElementById('dashboard').style.display = 'none'; }
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const btn = e.target.querySelector('button'); btn.innerText = "Authenticating...";
    try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
    catch (err) { showToast("Login failed.", true); btn.innerText = "Initialize Session"; }
  });
  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  window.switchTab = (tabId) => {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active'); event.currentTarget.classList.add('active');
  };

  async function loadAllData() {
    const profSnap = await getDoc(doc(db, "settings", "profile"));
    if (profSnap.exists()) {
      const p = profSnap.data();
      document.getElementById('prof-name').value = p.name || '';
      document.getElementById('prof-title').value = p.title || '';
      document.getElementById('prof-bio').value = p.bio || '';
    }
    
    // Load Portfolio Items with Edit Capability
    const contentBox = document.getElementById('content-container');
    contentBox.innerHTML = '';
    allContentData = {};
    const cSnap = await getDocs(collection(db, "portfolio_items"));
    cSnap.forEach(d => {
      const i = d.data();
      allContentData[d.id] = i; // Save data for editing
      contentBox.innerHTML += `
        <div class="data-card">
          <span class="badge">${i.category}</span>
          <h4 style="color:#fff;"><i class="${i.icon}" style="color:var(--cyan); margin-right:5px;"></i> ${i.title}</h4>
          <p style="font-size:0.8rem; color:var(--muted); margin:10px 0;">${i.desc}</p>
          <div style="display:flex; gap:10px;">
            <button onclick="editContent('${d.id}')" class="btn-outline" style="width:auto; padding:8px 16px; font-size:0.85rem;"><i class="fas fa-edit"></i> Edit</button>
            <button onclick="deleteDocItem('portfolio_items', '${d.id}')" class="btn-danger" style="margin:0;"><i class="fas fa-trash"></i></button>
          </div>
        </div>`;
    });

    loadCollection("events", "events-container", (i, id) => `<div class="data-card">${i.flyerUrl ? `<img src="${i.flyerUrl}" class="data-img">` : ''}<span class="badge">${i.date}</span><h4 style="color:#fff;">${i.title}</h4><button onclick="deleteDocItem('events', '${id}')" class="btn-danger" style="margin-top:10px;"><i class="fas fa-trash"></i> Remove</button></div>`);
    loadCollection("past_events", "past-events-container", (i, id) => `<div class="data-card"><img src="${i.imgUrl}" class="data-img"><h4 style="color:#fff;">${i.title}</h4><button onclick="deleteDocItem('past_events', '${id}')" class="btn-danger" style="margin-top:10px;"><i class="fas fa-trash"></i> Remove</button></div>`);
    
    // Reviews
    const revBox = document.getElementById('reviews-container'); revBox.innerHTML = '';
    const targets = ['smart-access', 'voting-platform', 'lyon-chops']; 
    for (const target of targets) {
      const rSnap = await getDocs(collection(db, "ratings", target, "detailed_reviews"));
      rSnap.forEach(d => { revBox.innerHTML += `<div class="data-card"><h4 style="color:#fff;">${d.data().name} <span style="color:#fde047; font-size:0.9rem;">(${d.data().rating}★)</span></h4><p style="color:var(--muted); font-size:0.85rem;"><i class="far fa-envelope"></i> ${d.data().email}</p><p style="color:var(--cyan); margin-top:10px; font-size:0.9rem;">"${d.data().comment}"</p></div>`; });
    }
  }

  async function loadCollection(colName, containerId, htmlFormatter) {
    const box = document.getElementById(containerId); box.innerHTML = '';
    const snap = await getDocs(collection(db, colName));
    snap.forEach(d => { box.innerHTML += htmlFormatter(d.data(), d.id); });
  }

  // --- SUBMIT FORMS ---
  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const btn = document.getElementById('prof-btn'); btn.innerText = "Uploading & Deploying...";
    try {
      const pData = { name: document.getElementById('prof-name').value, title: document.getElementById('prof-title').value, bio: document.getElementById('prof-bio').value };
      if(croppedProfileBlob) {
        pData.profilePicUrl = await uploadToCloudinary(croppedProfileBlob);
        croppedProfileBlob = null; document.getElementById('prof-pic').value = ''; document.getElementById('prof-img-status').innerText = '';
      } else {
        const oldSnap = await getDoc(doc(db, "settings", "profile"));
        if(oldSnap.exists() && oldSnap.data().profilePicUrl) pData.profilePicUrl = oldSnap.data().profilePicUrl;
      }
      await setDoc(doc(db, "settings", "profile"), pData);
      showToast("Profile Successfully Deployed."); btn.innerText = "Deploy Changes";
    } catch(err) { showToast("Error connecting to database.", true); btn.innerText = "Deploy Changes"; console.error(err); }
  });

  document.getElementById('event-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const btn = document.getElementById('ev-btn'); btn.innerText = "Uploading Flyer...";
    try {
      let flyerUrl = '';
      if(croppedEventBlob) { flyerUrl = await uploadToCloudinary(croppedEventBlob); croppedEventBlob = null; document.getElementById('ev-img-status').innerText = ''; }
      await addDoc(collection(db, "events"), {
        date: document.getElementById('ev-date').value, title: document.getElementById('ev-title').value,
        desc: document.getElementById('ev-desc').value, link: document.getElementById('ev-link').value,
        flyerUrl: flyerUrl, createdAt: new Date()
      });
      e.target.reset(); showToast("Event Scheduled."); btn.innerText = "Publish Event"; loadAllData();
    } catch(err) { showToast("Upload failed.", true); btn.innerText = "Publish Event"; console.error(err); }
  });

  document.getElementById('past-event-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const btn = document.getElementById('pe-btn'); btn.innerText = "Uploading Cover...";
    try {
      if(!croppedPastEventBlob) { showToast("Cover Image is required!", true); btn.innerText = "Add to Carousel"; return; }
      const imgUrl = await uploadToCloudinary(croppedPastEventBlob);
      await addDoc(collection(db, "past_events"), {
        title: document.getElementById('pe-title').value, desc: document.getElementById('pe-desc').value,
        imgUrl: imgUrl, createdAt: new Date()
      });
      e.target.reset(); croppedPastEventBlob = null; document.getElementById('pe-img-status').innerText = '';
      showToast("Added to Highlights."); btn.innerText = "Add to Carousel"; loadAllData();
    } catch(err) { showToast("Upload failed.", true); btn.innerText = "Add to Carousel"; console.error(err); }
  });

  // --- PORTFOLIO EDIT/ADD LOGIC ---
  window.editContent = (id) => {
    const data = allContentData[id];
    document.getElementById('cont-id').value = id;
    document.getElementById('cont-category').value = data.category;
    document.getElementById('cont-title').value = data.title;
    document.getElementById('cont-date').value = data.date || '';
    document.getElementById('cont-desc').value = data.desc;
    document.getElementById('cont-icon').value = data.icon;
    
    document.getElementById('cont-header').innerHTML = '<i class="fas fa-edit"></i> Edit Portfolio Item';
    document.getElementById('cont-submit-btn').innerText = "Update Item";
    document.getElementById('cont-cancel-btn').style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  document.getElementById('cont-cancel-btn').addEventListener('click', () => {
    document.getElementById('content-form').reset();
    document.getElementById('cont-id').value = '';
    document.getElementById('cont-header').innerHTML = '<i class="fas fa-plus-square"></i> Add Portfolio Item';
    document.getElementById('cont-submit-btn').innerText = "Push to Portfolio";
    document.getElementById('cont-cancel-btn').style.display = "none";
  });

  document.getElementById('content-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('cont-id').value;
    const data = {
      category: document.getElementById('cont-category').value, title: document.getElementById('cont-title').value,
      date: document.getElementById('cont-date').value, desc: document.getElementById('cont-desc').value,
      icon: document.getElementById('cont-icon').value
    };

    try {
      if (id) {
        await updateDoc(doc(db, "portfolio_items", id), data);
        showToast("Portfolio Item Updated.");
      } else {
        data.createdAt = new Date();
        await addDoc(collection(db, "portfolio_items"), data);
        showToast("Portfolio Item Added.");
      }
      document.getElementById('cont-cancel-btn').click(); // trigger form reset
      loadAllData();
    } catch (err) {
      showToast("Error saving content.", true);
    }
  });

  window.deleteDocItem = async (col, id) => {
    if(confirm("Permanently delete this from the live site?")) { await deleteDoc(doc(db, col, id)); showToast("Item Removed."); loadAllData(); }
  }
</script>
</body>
</html>
